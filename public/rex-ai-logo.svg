<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rexRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === REX AI GEAR EMBLEM === -->
  <g transform="translate(0, 0)">
    <!-- Outer Gear Body -->
    <path d="M 115.89 56.48 L 115.89 63.52 L 104.41 67.24 L 103.16 72.75 L 111.88 81.08 L 108.83 87.42 L 96.87 85.79 L 93.35 90.21 L 97.60 101.50 L 92.10 105.89 L 82.03 99.24 L 76.94 101.69 L 75.86 113.71 L 69.01 115.27 L 62.83 104.91 L 57.17 104.91 L 50.99 115.27 L 44.14 113.71 L 43.06 101.69 L 37.97 99.24 L 27.90 105.89 L 22.40 101.50 L 26.65 90.21 L 23.13 85.79 L 11.17 87.42 L 8.12 81.08 L 16.84 72.75 L 15.59 67.24 L 4.11 63.52 L 4.11 56.48 L 15.59 52.76 L 16.84 47.25 L 8.12 38.92 L 11.17 32.58 L 23.13 34.21 L 26.65 29.79 L 22.40 18.50 L 27.90 14.11 L 37.97 20.76 L 43.06 18.31 L 44.14 6.29 L 50.99 4.73 L 57.17 15.09 L 62.83 15.09 L 69.01 4.73 L 75.86 6.29 L 76.94 18.31 L 82.03 20.76 L 92.10 14.11 L 97.60 18.50 L 93.35 29.79 L 96.87 34.21 L 108.83 32.58 L 111.88 38.92 L 103.16 47.25 L 104.41 52.76 Z" fill="url(#rexRed)" />

    <!-- Center Outer White Ring -->
    <circle cx="60" cy="60" r="34" fill="#FFFFFF" />

    <!-- Center Inner Red Circle -->
    <circle cx="60" cy="60" r="28" fill="url(#rexRed)" />

    <!-- Subtle AI Circuit traces inside gear -->
    <path d="M 60 32 L 60 20 M 60 88 L 60 100 M 32 60 L 20 60 M 88 60 L 100 60" 
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="60" cy="20" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="60" cy="100" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="20" cy="60" r="2.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="100" cy="60" r="2.5" fill="#38BDF8" filter="url(#glow)"/>

    <!-- Geometric 'R' inside emblem -->
    <path d="M 47 43 H 63 Q 73 43 73 53 Q 73 62 64 63 L 73 77 H 64.5 L 56.5 64 H 53.5 V 77 H 47 Z M 53.5 49 V 58.5 H 62 Q 66.5 58.5 66.5 53.5 Q 66.5 49 62 49 Z" 
          fill="#FFFFFF" />

    <!-- AI Neural Eye / Spark inside the 'R' loop -->
    <circle cx="58" cy="53.8" r="2.8" fill="#38BDF8" filter="url(#glow)" />
  </g>

  <!-- === WORDMARK 'REX' (MATCHING BRAND GEOMETRY) === -->
  <g transform="translate(130, 22)">
    <!-- Letter R -->
    <path d="M 0 5 H 32 Q 49 5 49 24 Q 49 41 34 43 L 49 71 H 34 L 21 46 H 13 V 71 H 0 Z M 13 17 V 34 H 31 Q 36 34 36 24.5 Q 36 17 31 17 Z" 
          fill="url(#rexRed)" />

    <!-- Letter E -->
    <path d="M 58 5 H 98 V 17 H 71 V 31 H 93 V 43 H 71 V 59 H 98 V 71 H 58 Z" 
          fill="url(#rexRed)" />

    <!-- Letter X -->
    <path d="M 107 5 H 122 L 138 34 L 154 5 H 169 L 146 38 L 170 71 H 155 L 138 43 L 121 71 H 106 L 130 38 Z" 
          fill="url(#rexRed)" />
  </g>

  <!-- === 'AI' / 'AGENT' FUTURISTIC BADGE === -->
  <g transform="translate(315, 23)">
    <!-- High-tech Background Pill -->
    <rect x="0" y="4" width="92" height="64" rx="16" fill="#0F172A" stroke="url(#aiCyan)" stroke-width="2.5" />
    <rect x="2" y="6" width="88" height="30" rx="14" fill="#FFFFFF" opacity="0.08" />

    <!-- Glowing 'AI' Text -->
    <text x="46" y="42" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">AI</text>

    <!-- Subtitle 'AGENT' -->
    <rect x="16" y="48" width="60" height="13" rx="4" fill="url(#rexRed)"/>
    <text x="46" y="58" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AGENT</text>
  </g>
</svg>