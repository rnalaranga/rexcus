name: Deploy Rexcus ERP to VPS

on:
  push:
    branches:
      - main # ඔබේ default branch එක master නම් මෙය 'master' ලෙස වෙනස් කරන්න

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "=== Rexcus Deployment Started ==="
            export NODE_OPTIONS="--max-old-space-size=4096"

            # 1. Project Directory එකට යෑම
            cd /var/www/rexnw

            # 2. Local modifications discard කර GitHub එකෙන් අලුත්ම Code එකට sync කිරීම
            echo "Fetching latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 3. Frontend Build කිරීම
            echo "Installing root dependencies..."
            npm install
            echo "Building frontend..."
            npm run build

            # 4. Backend Dependencies Update කිරීම (api folder එක ඇත්නම්)
            if [ -d "api" ]; then
              echo "Installing API dependencies..."
              cd api
              npm install
              echo "Setting up Chrome for Puppeteer vector PDF..."
              rm -rf /var/www/rexnw/api/chrome-bin
              npx @puppeteer/browsers install chrome@stable --path /var/www/rexnw/api/chrome-bin || true
              cd ..
            fi

            # Linux headless Chrome dependencies
            echo "Checking Linux Chromium packages..."
            (sudo apt-get update -y && sudo apt-get install -y chromium-browser chromium libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libasound2) || true

            # 5. PM2 Backend Process එක Restart කිරීම
            echo "Restarting backend via PM2..."
            pm2 restart rexnw-backend --update-env || pm2 restart all
            pm2 status

            echo "=== Rexcus ERP Deployment Completed Successfully! ==="
