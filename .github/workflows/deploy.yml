name: Deploy Rexcus ERP to VPS

on:
  push:
    branches:
      - main # ඔබේ default branch එක master නම් මෙය 'master' ලෙස වෙනස් කරන්න

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. Project Directory එකට යෑම
            cd /var/www/rexnw

            # 2. GitHub එකෙන් අලුත්ම Code ටික Pull කිරීම
            git pull origin main

            # 3. Frontend Build කිරීම
            npm install
            npm run build

            # 4. Backend Dependencies Update කිරීම (api folder එක ඇත්නම්)
            if [ -d "api" ]; then
              cd api
              npm install
              cd ..
            fi

            # 5. PM2 Backend Process එක Restart කිරීම
            pm2 restart rexnw-backend --update-env

            echo "Rexcus ERP Deployment Completed Successfully!"
